# XcodeGen spec — `xcodegen generate` writes SecureChat.xcodeproj (gitignored).
# The CI workflow (.github/workflows/ios.yml) does exactly that; see README.md.
name: SecureChat
options:
  bundleIdPrefix: org.securechat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    # sync-web.sh writes into the bundle, which the script sandbox forbids.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  SecureChat:
    type: application
    platform: iOS
    sources:
      - path: SecureChat
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.securechat.app
        PRODUCT_NAME: SecureChat
        INFOPLIST_FILE: SecureChat/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
    postCompileScripts:
      - name: Bundle web client
        script: '"${SRCROOT}/scripts/sync-web.sh"'
        basedOnDependencyAnalysis: false
  SecureChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SecureChatTests
    dependencies:
      - target: SecureChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.securechat.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SecureChat.app/SecureChat"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SecureChat:
    build:
      targets:
        SecureChat: all
        SecureChatTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SecureChatTests
